version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sdm_dashboard_backend
    restart: always
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=0

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sdm_dashboard_frontend
    restart: always
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend

volumes:
  sqlite_data:
