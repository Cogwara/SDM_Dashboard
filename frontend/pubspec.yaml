name: SDM_Dashboard
description: A Flutter application.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  http: ^1.5.0
  dio: ^5.9.0

  # State Management
  provider: ^6.1.5

  # Local Storage
  shared_preferences: ^2.5.3

  # JWT Authentication
  jwt_decoder: ^2.0.1

  # JSON
  intl: ^0.20.2

  # UI
  flutter_spinkit: ^5.2.2
  flutter_svg: ^2.2.0
  cached_network_image: ^3.4.1

  # Images
  image_picker: ^1.2.0

  # Permissions
  permission_handler: ^12.0.1

  # URL Launcher
  url_launcher: ^6.3.2

  # Connectivity
  connectivity_plus: ^7.0.0

  # Device Info
  device_info_plus: ^12.2.0

  # Package Info
  package_info_plus: ^9.0.0

  # File Picker
  file_picker: ^10.3.2

  # Path
  path_provider: ^2.1.5

  # Logging
  logger: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/json/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700