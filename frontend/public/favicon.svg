<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Cyan Signal Glow -->
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Emerald Pulse Glow -->
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.3" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Card Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="8" />

  <!-- Outer Signal Wave Arcs -->
  <path d="M 126 230 A 150 150 0 0 1 386 230" fill="none" stroke="url(#cyan-grad)" stroke-width="16" stroke-linecap="round" opacity="0.4" />
  <path d="M 166 210 A 100 100 0 0 1 346 210" fill="none" stroke="url(#cyan-grad)" stroke-width="18" stroke-linecap="round" opacity="0.75" />
  <path d="M 206 190 A 60 60 0 0 1 306 190" fill="none" stroke="url(#emerald-grad)" stroke-width="20" stroke-linecap="round" />

  <!-- Transmission Antenna Tower Structure -->
  <g filter="url(#glow)">
    <!-- Tower Mast Peak -->
    <circle cx="256" cy="150" r="22" fill="url(#cyan-grad)" />
    <circle cx="256" cy="150" r="10" fill="#ffffff" />
    <line x1="256" y1="110" x2="256" y2="150" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />

    <!-- Main Tower Structure -->
    <polygon points="256,170 190,390 322,390" fill="none" stroke="url(#cyan-grad)" stroke-width="20" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Cross Bracing Structural Beams -->
    <line x1="230" y1="250" x2="282" y2="250" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" />
    <line x1="210" y1="320" x2="302" y2="320" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" opacity="0.9" />
    
    <line x1="230" y1="250" x2="302" y2="320" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" opacity="0.6" />
    <line x1="282" y1="250" x2="210" y2="320" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Network Node Indicators -->
  <circle cx="190" cy="390" r="14" fill="url(#emerald-grad)" />
  <circle cx="322" cy="390" r="14" fill="url(#emerald-grad)" />

  <!-- SDM Badge Monogram at Base -->
  <rect x="136" y="408" width="240" height="58" rx="20" fill="#090d16" stroke="url(#cyan-grad)" stroke-width="4" />
  <text x="256" y="447" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="4">SDM</text>
</svg>